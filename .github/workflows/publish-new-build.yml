name: Publish new build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and replace repo contents
        run: |
          set -euo pipefail
          test -f chitthi-ghp.zip
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o chitthi-ghp.zip -d /tmp/extracted
          SRC=/tmp/extracted
          entries=("$SRC"/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ] && [ -f "${entries[0]}/index.html" ]; then
            SRC="${entries[0]}"
          fi
          test -f "$SRC/index.html"
          test -f "$SRC/privacy.html"
          test -f "$SRC/manifest.webmanifest"
          test -f "$SRC/sw.js"
          test -d "$SRC/assets"
          test -d "$SRC/discover"
          test -d "$SRC/icons"
          test -d "$SRC/presets"
          test -d "$SRC/stickers"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .
          test -f index.html
          test ! -e chitthi-ghp.zip
          test ! -e .github
          ls -la
          git config user.name "maruftalukder1"
          git config user.email "maruftalukder1@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Update Chitthi site to new build"
          git push origin main
