name: Unzip Chitthi build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Extract zip to temp folder
        run: |
          set -euxo pipefail
          ls -la
          unzip -l chitthi-ghp.zip
          rm -rf /tmp/newbuild
          mkdir -p /tmp/newbuild
          unzip -o chitthi-ghp.zip -d /tmp/newbuild
          echo '--- top level ---'
          ls -la /tmp/newbuild
          find /tmp/newbuild | head -n 300
      - name: Replace repo contents with new build
        run: |
          set -euxo pipefail
          SRC=/tmp/newbuild
          DIRS=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find "$SRC" -mindepth 1 -maxdepth 1 ! -type d | wc -l)
          if [ "$DIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            SRC=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d)
            echo "Single top-level folder, using $SRC"
          fi
          test -n "$(ls -A "$SRC")"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf __MACOSX .DS_Store
          rm -f chitthi-ghp.zip
          rm -rf .github
          echo '--- new root ---'
          ls -la
          test -f index.html
          test -f privacy.html
          test -d assets
          test -d presets
          test -d discover
          ls manifest* sw*
      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name 'maruftalukder1'
          git config user.email 'maruftalukder1@users.noreply.github.com'
          git status --short
          git add -A
          git status --short
          git commit -m 'Update Chitthi site to new build'
          git push origin main
