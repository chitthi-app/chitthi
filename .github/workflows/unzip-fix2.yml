name: Unzip fix-round-2 build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip fix-round-2 build and replace repo contents
        run: |
          set -euo pipefail
          test -f chitthi-fix2.zip
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o chitthi-fix2.zip -d /tmp/extracted
          SRC=/tmp/extracted
          if [ ! -f "$SRC/index.html" ] && [ "$(ls -1 "$SRC" | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -1 "$SRC")" ]; then
            SRC="$SRC/$(ls -1 "$SRC")"
          fi
          test -f "$SRC/index.html"
          test -f "$SRC/privacy.html"
          test -d "$SRC/assets"
          test -d "$SRC/discover"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .
          test -f index.html
          test -f privacy.html
          test ! -e chitthi-fix2.zip
          test ! -e .github
          ls -la
          git config user.name "maruftalukder1"
          git config user.email "maruftalukder1@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Update Chitthi site to new build"
          git push origin main
